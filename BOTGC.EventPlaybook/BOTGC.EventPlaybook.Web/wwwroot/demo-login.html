<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title data-club-title-prefix="Development access">Development access · Event Playbook</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #173f49;
      background: #edf4f1;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 82% 12%, rgba(204, 166, 90, .2), transparent 30%),
        linear-gradient(145deg, #073c4c 0 34%, #edf4f1 34% 100%);
    }
    main {
      width: min(100%, 460px);
      overflow: hidden;
      border: 1px solid rgba(16, 70, 81, .14);
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 28px 70px rgba(2, 40, 51, .2);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 28px 32px 26px;
      color: #fff;
      background: linear-gradient(120deg, #073c4c, #145968);
    }
    .brand img { width: 58px; height: 68px; flex: 0 0 58px; object-fit: contain; }
    .brand small {
      display: block;
      margin-bottom: 7px;
      color: #dfbd70;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .brand strong {
      display: block;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(28px, 7vw, 38px);
      line-height: 1.05;
    }
    .content { padding: 30px 32px 34px; }
    h1 {
      margin: 0 0 9px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
    }
    p {
      margin: 0 0 24px;
      color: #60767b;
      line-height: 1.55;
    }
    label {
      display: grid;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
    }
    input {
      width: 100%;
      min-height: 50px;
      border: 1px solid #b8c9c9;
      border-radius: 12px;
      padding: 0 14px;
      color: #143f49;
      background: #fbfdfc;
      font: inherit;
      font-weight: 500;
    }
    input:focus {
      border-color: #0e6374;
      outline: 3px solid rgba(14, 99, 116, .13);
    }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: 12px;
      color: #093943;
      background: linear-gradient(180deg, #e7c77c, #d4aa51);
      box-shadow: 0 8px 18px rgba(157, 115, 32, .2);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.04); }
    .error {
      margin: 0 0 18px;
      border: 1px solid #e4b7ad;
      border-radius: 10px;
      padding: 11px 13px;
      color: #8a3024;
      background: #fff3f0;
      font-size: 14px;
      font-weight: 700;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/assets/botgc-mark.svg" alt="" data-club-branding-crest>
      <div><small data-club-branding-name>Burton-on-Trent Golf Club</small><strong>Event Playbook</strong></div>
    </div>
    <div class="content">
      <h1>Development access</h1>
      <p>This preview is still under development. Enter the shared testing password to continue.</p>
      <p id="loginError" class="error hidden" role="alert">That password was not recognised. Please try again.</p>
      <form action="/auth/login" method="post">
        <input id="returnUrl" name="returnUrl" type="hidden" value="/">
        <label for="password">
          Shared password
          <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
        </label>
        <button type="submit">Open Event Playbook</button>
      </form>
    </div>
  </main>
  <script src="/branding.js?v=20260829-club-branding-1"></script>
  <script>
    const parameters = new URLSearchParams(window.location.search);
    const requestedReturnUrl = parameters.get('returnUrl') || '/';
    const safeReturnUrl = requestedReturnUrl.startsWith('/') && !requestedReturnUrl.startsWith('//')
      ? requestedReturnUrl
      : '/';
    document.getElementById('returnUrl').value = safeReturnUrl;
    document.getElementById('loginError').classList.toggle('hidden', parameters.get('error') !== '1');
  </script>
</body>
</html>
