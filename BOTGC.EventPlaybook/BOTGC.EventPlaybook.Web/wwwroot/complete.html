<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-club-title-prefix="Complete Event Task">Complete Event Task | Burton-on-Trent Golf Club</title>
  <link rel="stylesheet" href="./playbook.css?v=20260829-retrospective-analysis-1">
  <link rel="stylesheet" href="./complete.css?v=20260925-email-workspace-1">
</head>
<body class="completion-body">
  <main class="completion-page">
    <section class="completion-card" id="completionCard">
      <header class="completion-brand">
        <span class="completion-mark">
          <img class="brand-mark brand-mark-image" src="./assets/botgc-mark.svg" width="56" height="64" alt="Burton-on-Trent Golf Club crest" data-club-branding-crest>
        </span>
        <div>
          <div class="brand-kicker" data-club-branding-name>Burton-on-Trent Golf Club</div>
          <h1>Event task</h1>
        </div>
      </header>
      <div id="completionWorkspace" class="completion-workspace">
        <nav id="completionTaskList" class="completion-task-list" aria-label="Tasks in this email" hidden></nav>
        <div id="completionContent" class="completion-content">Loading task…</div>
      </div>
    </section>
  </main>
  <script src="./branding.js?v=20260829-club-branding-1"></script>
  <script type="module">
    const content = document.getElementById('completionContent');
    const taskList = document.getElementById('completionTaskList');
    const params = new URLSearchParams(location.search);
    const accessToken = params.get('access');
    const requestedTaskToken = params.get('task');
    const legacyTaskToken = params.get('token');
    let tasks = [];
    let token = requestedTaskToken || legacyTaskToken;

    try {
      if (accessToken) {
        const response = await fetch(`/api/tasks/email-access/${encodeURIComponent(accessToken)}`);
        if (!response.ok) {
          renderError('Task email not found', 'This secure email link is invalid or is no longer available.');
        } else {
          const workspace = await response.json();
          tasks = Array.isArray(workspace.tasks) ? workspace.tasks : [];
          if (!tasks.length) {
            renderError('No tasks available', 'There are no tasks attached to this email link.');
          } else {
            token = tasks.some(task => task.token === requestedTaskToken)
              ? requestedTaskToken
              : tasks[0].token;
            renderWorkspace();
          }
        }
      } else if (!token) {
        content.innerHTML = '<div class="completion-state-mark">!</div><h2>Invalid task link</h2><p>This completion link does not contain a task token.</p>';
      } else {
        const response = await fetch(`/api/tasks/completion-links/${encodeURIComponent(token)}`);
        if (!response.ok) {
          content.innerHTML = '<div class="completion-state-mark">!</div><h2>Task link not found</h2><p>The link may have expired or may not have been registered.</p>';
        } else {
          tasks = [await response.json()];
          renderWorkspace();
        }
      }
    } catch {
      renderError('Unable to load this task', 'Please check your connection and try the link again.');
    }

    function renderError(title, message) {
      taskList.hidden = true;
      content.innerHTML = `<div class="completion-state-mark">!</div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p>`;
    }

    function renderWorkspace() {
      const selected = tasks.find(task => task.token === token) || tasks[0];
      token = selected.token;
      taskList.hidden = tasks.length < 2;
      taskList.innerHTML = tasks.length < 2 ? '' : `
        <div class="completion-task-list-heading">
          <span class="eyebrow">This email</span>
          <strong>${tasks.length} tasks requiring attention</strong>
          <small>You can open only the tasks included in this email.</small>
        </div>
        ${tasks.map(task => `
          <button type="button" class="completion-task-link ${task.token === token ? 'selected' : ''}" data-task-token="${escapeHtml(task.token)}">
            <span>${escapeHtml(task.eventName)}</span>
            <strong>${escapeHtml(task.taskTitle)}</strong>
            <small>${taskStatus(task)}</small>
          </button>`).join('')}`;
      taskList.querySelectorAll('[data-task-token]').forEach(button => button.addEventListener('click', () => {
        token = button.dataset.taskToken;
        const url = new URL(location.href);
        url.searchParams.set('task', token);
        history.replaceState(null, '', url);
        renderWorkspace();
      }));
      render(selected);
    }

    function taskStatus(task) {
      if (task.completedAtUtc) return 'Completed';
      if (task.expiresOn && currentClubIsoDate() > task.expiresOn) return 'Expired';
      if (task.canCompleteFromLink === false) return 'Needs information';
      return task.dueDate
        ? `Due ${new Date(task.dueDate + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`
        : 'Open task';
    }

    function render(task) {
      if (task.completedAtUtc) {
        content.innerHTML = `
          <div class="success-mark">✓</div>
          <h2>Task completed</h2>
          <p><strong>${escapeHtml(task.taskTitle)}</strong></p>
          <p class="help-text">${escapeHtml(task.eventName)}</p>
          <p>This task was completed on ${new Date(task.completedAtUtc).toLocaleString('en-GB')}.</p>`;
        return;
      }

      if (task.expiresOn && currentClubIsoDate() > task.expiresOn) {
        content.innerHTML = `
          <div class="completion-state-mark">—</div>
          <h2>Task expired</h2>
          <p><strong>${escapeHtml(task.taskTitle)}</strong></p>
          <p class="help-text">${escapeHtml(task.eventName)}</p>
          <p>This task was only needed before the event. Its completion link is no longer active.</p>`;
        return;
      }

      if (task.canCompleteFromLink === false) {
        content.innerHTML = `
          <span class="eyebrow completion-eyebrow">${escapeHtml(task.eventName)}</span>
          <h2>${escapeHtml(task.taskTitle)}</h2>
          ${renderDetails(task)}
          ${renderTaskNote(task.notes)}
          ${renderLearning(task.learningInsights)}
          <div class="completion-restricted-notice"><strong>More information is needed</strong><p>This task cannot be completed from the restricted email view because its planning information must be reviewed first. Please contact the event organiser to provide or confirm the missing details.</p></div>`;
        return;
      }

      content.innerHTML = `
        <span class="eyebrow completion-eyebrow">${escapeHtml(task.eventName)}</span>
        <h2>${escapeHtml(task.taskTitle)}</h2>
        ${renderDetails(task)}
        ${renderTaskNote(task.notes)}
        ${renderLearning(task.learningInsights)}
        <label class="completion-notes"><span>Completion note <em>optional</em></span><textarea id="completionNotes" rows="4" placeholder="Add anything the event coordinator should know"></textarea></label>
        <button class="button button-primary" id="completeButton">Mark task complete</button>`;

      document.getElementById('completeButton').addEventListener('click', async () => {
        const button = document.getElementById('completeButton');
        button.disabled = true;
        button.textContent = 'Completing…';
        const result = await fetch(`/api/tasks/completion-links/${encodeURIComponent(token)}/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: document.getElementById('completionNotes').value })
        });
        if (!result.ok) {
          button.disabled = false;
          button.textContent = 'Mark task complete';
          alert('The task could not be completed.');
          return;
        }
        const completed = await result.json();
        tasks = tasks.map(task => task.token === completed.token ? completed : task);
        renderWorkspace();
      });
    }

    function renderDetails(task) {
      return `<div class="completion-details">
        ${task.assignee ? `<div><span>Assigned to</span><strong>${escapeHtml(task.assignee)}</strong></div>` : ''}
        ${task.dueDate ? `<div><span>Due</span><strong>${new Date(task.dueDate + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</strong></div>` : ''}
      </div>`;
    }

    function renderTaskNote(note) {
      return note ? `<aside class="completion-task-note"><strong>Task note</strong><p>${escapeHtml(note)}</p></aside>` : '';
    }

    function renderLearning(insights) {
      if (!Array.isArray(insights) || !insights.length) return '';
      return `<aside class="completion-learning">
        <div class="completion-learning-heading"><span>↺</span><div><strong>Learning from last time</strong><small>Consider this before completing the task</small></div></div>
        ${insights.map(insight => `<div class="completion-learning-entry"><p>${escapeHtml(insight.summary)}</p><small>${escapeHtml(insight.sourceEventName || 'Previous event')}${insight.sourceEventDate ? ` · ${new Date(insight.sourceEventDate + 'T12:00:00').toLocaleDateString('en-GB')}` : ''}${insight.sourceType === 'internal-retrospective' ? ' · internal retrospective' : insight.evidenceCount ? ` · based on ${escapeHtml(insight.evidenceCount)} response${Number(insight.evidenceCount) === 1 ? '' : 's'}` : ''}</small></div>`).join('')}
      </aside>`;
    }

    function currentClubIsoDate(date = new Date()) {
      const formatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/London',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
      const parts = Object.fromEntries(formatter.formatToParts(date).map(part => [part.type, part.value]));
      return `${parts.year}-${parts.month}-${parts.day}`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
