<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-club-title-prefix="Complete Event Task">Complete Event Task | Burton-on-Trent Golf Club</title>
  <link rel="stylesheet" href="./playbook.css?v=20260829-retrospective-analysis-1">
  <link rel="stylesheet" href="./complete.css?v=20260828-attendee-feedback-1">
</head>
<body class="completion-body">
  <main class="completion-page">
    <section class="completion-card" id="completionCard">
      <header class="completion-brand">
        <span class="completion-mark">
          <img class="brand-mark brand-mark-image" src="./assets/botgc-mark.svg" width="56" height="64" alt="Burton-on-Trent Golf Club crest" data-club-branding-crest>
        </span>
        <div>
          <div class="brand-kicker" data-club-branding-name>Burton-on-Trent Golf Club</div>
          <h1>Event task</h1>
        </div>
      </header>
      <div id="completionContent" class="completion-content">Loading task…</div>
    </section>
  </main>
  <script src="./branding.js?v=20260829-club-branding-1"></script>
  <script type="module">
    const content = document.getElementById('completionContent');
    const token = new URLSearchParams(location.search).get('token');

    try {
      if (!token) {
        content.innerHTML = '<div class="completion-state-mark">!</div><h2>Invalid task link</h2><p>This completion link does not contain a task token.</p>';
      } else {
        const response = await fetch(`/api/tasks/completion-links/${encodeURIComponent(token)}`);
        if (!response.ok) {
          content.innerHTML = '<div class="completion-state-mark">!</div><h2>Task link not found</h2><p>The link may have expired or may not have been registered.</p>';
        } else {
          render(await response.json());
        }
      }
    } catch {
      content.innerHTML = '<div class="completion-state-mark">!</div><h2>Unable to load this task</h2><p>Please check your connection and try the link again.</p>';
    }

    function render(task) {
      if (task.completedAtUtc) {
        content.innerHTML = `
          <div class="success-mark">✓</div>
          <h2>Task completed</h2>
          <p><strong>${escapeHtml(task.taskTitle)}</strong></p>
          <p class="help-text">${escapeHtml(task.eventName)}</p>
          <p>This task was completed on ${new Date(task.completedAtUtc).toLocaleString('en-GB')}.</p>`;
        return;
      }

      content.innerHTML = `
        <span class="eyebrow completion-eyebrow">${escapeHtml(task.eventName)}</span>
        <h2>${escapeHtml(task.taskTitle)}</h2>
        <div class="completion-details">
          ${task.assignee ? `<div><span>Assigned to</span><strong>${escapeHtml(task.assignee)}</strong></div>` : ''}
          ${task.dueDate ? `<div><span>Due</span><strong>${new Date(task.dueDate + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</strong></div>` : ''}
        </div>
        ${renderLearning(task.learningInsights)}
        <label class="completion-notes"><span>Completion note <em>optional</em></span><textarea id="completionNotes" rows="4" placeholder="Add anything the event coordinator should know"></textarea></label>
        <button class="button button-primary" id="completeButton">Mark task complete</button>`;

      document.getElementById('completeButton').addEventListener('click', async () => {
        const button = document.getElementById('completeButton');
        button.disabled = true;
        button.textContent = 'Completing…';
        const result = await fetch(`/api/tasks/completion-links/${encodeURIComponent(token)}/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ notes: document.getElementById('completionNotes').value })
        });
        if (!result.ok) {
          button.disabled = false;
          button.textContent = 'Mark task complete';
          alert('The task could not be completed.');
          return;
        }
        render(await result.json());
      });
    }

    function renderLearning(insights) {
      if (!Array.isArray(insights) || !insights.length) return '';
      return `<aside class="completion-learning">
        <div class="completion-learning-heading"><span>↺</span><div><strong>Learning from last time</strong><small>Consider this before completing the task</small></div></div>
        ${insights.map(insight => `<div class="completion-learning-entry"><p>${escapeHtml(insight.summary)}</p><small>${escapeHtml(insight.sourceEventName || 'Previous event')}${insight.sourceEventDate ? ` · ${new Date(insight.sourceEventDate + 'T12:00:00').toLocaleDateString('en-GB')}` : ''}${insight.sourceType === 'internal-retrospective' ? ' · internal retrospective' : insight.evidenceCount ? ` · based on ${escapeHtml(insight.evidenceCount)} response${Number(insight.evidenceCount) === 1 ? '' : 's'}` : ''}</small></div>`).join('')}
      </aside>`;
    }

    function escapeHtml(value) {
      return String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
    }
  </script>
</body>
</html>
