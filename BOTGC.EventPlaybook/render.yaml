services:
  - type: web
    name: botgc-event-playbook-dev
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: BOTGC.EventPlaybook
    dockerfilePath: ./BOTGC.EventPlaybook.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: botgc-playbook-data
      mountPath: /app/App_Data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DEMO_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_IMAGE_QUALITY
        value: high
      - key: OPENAI_PROMPT_MODEL
        value: gpt-5.6
      - key: YODECK_API_TOKEN
        sync: false
      - key: YODECK_PLAYLIST_ID
        sync: false
      - key: YODECK_API_TOKEN_LABEL
        value: event-playbook
      - key: YODECK_PLAYLIST_NAME
        value: Clubhouse
      - key: YODECK_MEDIA_DURATION_SECONDS
        value: 15
      - key: EventPlaybookApi__BaseUrl
        value: http://botgc-event-playbook-api-dev:10000
      - key: EventPlaybookApi__ApiKey
        sync: false

  - type: pserv
    name: botgc-event-playbook-api-dev
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    rootDir: BOTGC.EventPlaybook
    dockerfilePath: ./BOTGC.EventPlaybook.API/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EventPlaybookApi__ApiKey
        sync: false
      - key: IntelligentGolf__BaseUrl
        value: https://www.botgc.co.uk
      - key: Cache__Provider
        value: Memory
