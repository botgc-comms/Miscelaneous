services:
  - type: web
    name: botgc-event-playbook-dev
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: BOTGC.EventPlaybook
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: botgc-playbook-data
      mountPath: /app/App_Data
      sizeGB: 1
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DEMO_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_IMAGE_QUALITY
        value: high
      - key: OPENAI_PROMPT_MODEL
        value: gpt-5.6
      - key: YODECK_API_TOKEN
        sync: false
      - key: YODECK_PLAYLIST_ID
        sync: false
      - key: YODECK_API_TOKEN_LABEL
        value: event-playbook
      - key: YODECK_PLAYLIST_NAME
        value: Clubhouse
      - key: YODECK_MEDIA_DURATION_SECONDS
        value: 15
      - key: INTELLIGENT_GOLF_DIARY_ENDPOINT
        sync: false
      - key: INTELLIGENT_GOLF_API_TOKEN
        sync: false
      - key: INTELLIGENT_GOLF_CLUB_ID
        sync: false
      - key: INTELLIGENT_GOLF_DIARY_HTTP_METHOD
        value: PUT
