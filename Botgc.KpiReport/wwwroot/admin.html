<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI report administration</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <div>
        <p class="eyebrow">Burton-on-Trent Golf Club</p>
        <h1>KPI reports</h1>
        <p>Create reports, enter monthly actuals and open the generated web report.</p>
      </div>
      <div class="header-actions">
        <a class="button button--secondary" href="/">View latest report</a>
        <a class="button" href="/admin/create.html">Add KPI report</a>
      </div>
    </header>

    <section class="admin-card">
      <div class="card-heading">
        <div>
          <h2>Available reports</h2>
          <p>Each report is stored as an individual JSON file in <code>Data/KpiReports</code>.</p>
        </div>
        <span id="report-count" class="count-badge"></span>
      </div>

      <div id="report-list" class="report-list" aria-live="polite"></div>
      <p id="admin-status" class="status-message"></p>
    </section>
  </main>
  <script src="/js/admin.js"></script>
</body>
</html>
