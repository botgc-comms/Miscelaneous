services:
  - type: web
    name: junior-golf-sixes
    runtime: docker
    rootDir: Sixers_Scoring
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_PATH
        value: /var/data
      - key: PRIVATE_PREVIEW
        sync: false
      - key: GOLFSIXES_PUBLIC_ORIGIN
        value: https://golfsixesleague.co.uk
      - key: AUTH_FROM_EMAIL
        value: GolfSixes League <hello@golfsixesleague.co.uk>
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        sync: false
      - key: DATA_DIR
        value: /var/data/golfsixes-league
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
    disk:
      name: sixes-scores
      mountPath: /var/data
      sizeGB: 1


